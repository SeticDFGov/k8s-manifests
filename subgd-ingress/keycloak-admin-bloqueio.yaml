# O Keycloak passa a ser público em https://subgd-api.df.gov.br/keycloak (login OIDC), mas o
# console e a API de administração não: no endereço público, /keycloak/admin responde 403 para
# todo mundo. A administração continua pelo endereço interno (keycloak.10.233.159.150.nip.io).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: keycloak-admin-bloqueio
spec:
  ipAllowList:
    sourceRange:
      - 127.0.0.1/32
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-admin-bloqueio
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: default-keycloak-admin-bloqueio@kubernetescrd
spec:
  rules:
    - host: subgd-api.df.gov.br
      http:
        paths:
          - path: /keycloak/admin
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
  tls:
    - hosts:
        - subgd-api.df.gov.br
      secretName: subgd-api-tls
