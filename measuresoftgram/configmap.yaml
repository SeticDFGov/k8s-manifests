apiVersion: v1
kind: ConfigMap
metadata:
  name: msgram-config
data:
  DJANGO_SETTINGS_MODULE: config.settings.production
  DEBUG: "FALSE"
  CREATE_FAKE_DATA: "FALSE"
  # Em banco vazio (1º deploy) precisa ser "TRUE": com FALSE o APScheduler grava no banco
  # antes do migrate e o boot quebra. Depois do 1º migrate, "FALSE" liga o scheduler.
  AMBIENT_TEST_OR_DEV: "FALSE"
  RUN_LOAD_INITIAL_DATA: "true"
  GUNICORN_WORKERS: "3"
  GUNICORN_TIMEOUT: "120"
  ALLOWED_HOSTS: msgram.10.233.159.150.nip.io,msgram-service,localhost
  CSRF_TRUSTED_ORIGINS: https://msgram.10.233.159.150.nip.io
  CORS_ALLOWED_ORIGINS: https://msgram.10.233.159.150.nip.io
  FRONTEND_PROD_URL: https://msgram.10.233.159.150.nip.io
  LOGIN_REDIRECT_URL: https://msgram.10.233.159.150.nip.io
  # Mesmo Postgres do extrator SES, isolado no schema msgram (o schema precisa existir antes do migrate).
  POSTGRES_HOST: 10.230.81.119
  POSTGRES_PORT: "5432"
  POSTGRES_DB: db_centralrelacionamento
  # libpq/psycopg2 aplica isso em toda conexão: tabelas do Django vão para o schema msgram, não para o public
  PGOPTIONS: -c search_path=msgram
