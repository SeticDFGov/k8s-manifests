# Tema de login do SGDP: a mesma tela de login do front (fundo, cartão, marca do GDF, campos
# com ícone, mostrar a senha, botão azul e caixa de erro vermelha), agora servida pelo Keycloak.
# Herda o "base" (os modelos sem estilo), então as outras telas (senha expirada, erro, sessão
# expirada) usam o template.ftl daqui e o mesmo cartão.
parent=base
import=common/keycloak
locales=pt-BR

styles=css/sgdp.css
meta=viewport==width=device-width,initial-scale=1 robots==noindex,nofollow

# Classes que os modelos do base usam nas outras telas, ligadas ao CSS deste tema
kcHtmlClass=sgdp
kcFormGroupClass=grupo
kcLabelClass=rotulo
kcInputClass=campo
kcInputErrorMessageClass=campo-erro
kcInputGroup=campo-com-botao
kcButtonClass=botao
kcButtonPrimaryClass=botao-primario
kcButtonDefaultClass=botao-secundario
kcButtonBlockClass=botao-bloco
kcButtonLargeClass=
kcAlertClass=aviso
kcAlertTitleClass=aviso-texto
kcFormPasswordVisibilityButtonClass=botao-senha
kcFormSettingClass=opcoes
kcFormOptionsWrapperClass=opcoes-links
