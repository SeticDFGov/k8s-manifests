apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - statefulset.yaml
  - service.yaml
  - service-discovery.yaml
  - ingress.yaml
# Tema de login do SGDP (tema-sgdp/login): a mesma tela de login do front. Vai num ConfigMap
# montado em /opt/keycloak/themes/sgdp; o sufixo de hash no nome muda a cada alteração do tema,
# o que reinicia o pod (o Keycloak guarda o tema em cache). Qual tema o realm usa é escolhido
# por configurar-tema-login.sh.
configMapGenerator:
  - name: keycloak-tema-sgdp
    files:
      - theme.properties=tema-sgdp/login/theme.properties
      - template.ftl=tema-sgdp/login/template.ftl
      - login.ftl=tema-sgdp/login/login.ftl
      - messages_pt_BR.properties=tema-sgdp/login/messages/messages_pt_BR.properties
      - sgdp.css=tema-sgdp/login/resources/css/sgdp.css
      - sgdp.js=tema-sgdp/login/resources/js/sgdp.js
      - marca-gdf.png=tema-sgdp/login/resources/img/marca-gdf.png
      - favicon.ico=tema-sgdp/login/resources/img/favicon.ico
