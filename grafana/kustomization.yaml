apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - provisioning.yaml
generatorOptions:
  disableNameSuffixHash: true
# Um ConfigMap por dashboard (limite de 1 MiB por objeto)
configMapGenerator:
  - name: grafana-dashboard-node-exporter-full
    namespace: grafana
    files: [dashboards/node-exporter-full.json]
  - name: grafana-dashboard-kubernetes
    namespace: grafana
    files: [dashboards/kubernetes-global.json, dashboards/kubernetes-nodes.json, dashboards/kubernetes-pods.json]
  - name: grafana-dashboard-victoriametrics
    namespace: grafana
    files: [dashboards/victoriametrics.json]
