apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
        supplementalGroups:
          - 0
      containers:
        - name: grafana
          image: grafana/grafana:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-grafana
              containerPort: 3000
          env:
            - name: GF_SERVER_DOMAIN
              value: grafana.10.233.159.150.nip.io
            - name: GF_SERVER_ROOT_URL
              value: http://grafana.10.233.159.150.nip.io/
            - name: GF_AUTH_LDAP_ENABLED
              value: "true"
          resources:
            requests:
              cpu: 250m
              memory: 750Mi
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /robots.txt
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: grafana-pv
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dash-node
              mountPath: /etc/grafana/dashboards/node
              readOnly: true
            - name: dash-kubernetes
              mountPath: /etc/grafana/dashboards/kubernetes
              readOnly: true
            - name: dash-victoriametrics
              mountPath: /etc/grafana/dashboards/victoriametrics
              readOnly: true
      volumes:
        - name: grafana-pv
          persistentVolumeClaim:
            claimName: grafana-pvc
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dash-node
          configMap:
            name: grafana-dashboard-node-exporter-full
        - name: dash-kubernetes
          configMap:
            name: grafana-dashboard-kubernetes
        - name: dash-victoriametrics
          configMap:
            name: grafana-dashboard-victoriametrics
