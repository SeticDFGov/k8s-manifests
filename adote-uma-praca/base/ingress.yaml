# Site e API no mesmo domínio: "/" para o front e "/api" para a API.
# O host é definido em cada overlay. TLS é terminado antes do Traefik, como
# nos demais sistemas da SUBGD.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adote-uma-praca
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: HOST
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: adote-api, port: { number: 80 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: adote-front, port: { number: 80 } }
