# API (Node.js + Fastify). Segredos no Secret "adote-api-segredos", criado no
# cluster fora do Git (este repositório é público). Ver README desta pasta.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adote-api
  labels: { app: adote-api }
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: adote-api }
  template:
    metadata:
      labels: { app: adote-api }
    spec:
      imagePullSecrets:
        - name: ghcr-seticdfgov
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: adote-api
          ports:
            - { name: http, containerPort: 3000 }
          envFrom:
            - configMapRef: { name: adote-api-config }
            - secretRef: { name: adote-api-segredos }
          readinessProbe:
            httpGet: { path: /api/pronto, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/saude, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: adote-api
spec:
  selector: { app: adote-api }
  ports:
    - { name: http, port: 80, targetPort: http }
---
# Migrações do banco a cada sincronização (mesma imagem da API).
# Hook "Sync" na onda 1, não PreSync: o Job lê o ConfigMap gerado pelo kustomize
# (nome com hash), que só existe depois de aplicado na onda 0 da fase Sync.
# A API fica na onda 2: os pods novos só sobem depois da migração concluída.
apiVersion: batch/v1
kind: Job
metadata:
  name: adote-api-migracoes
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-seticdfgov
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: migracoes
          image: adote-api
          command: ["node", "dist/migrar.js"]
          envFrom:
            - configMapRef: { name: adote-api-config }
            - secretRef: { name: adote-api-segredos }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
