apiVersion: apps/v1
kind: Deployment
metadata:
  name: meu-backend-deployment
  labels:
    app: meu-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: meu-backend
  template:
    metadata:
      labels:
        app: meu-backend
    spec:
      containers:
        - name: meu-backend-container
          image: sousacomz/sgpd_service:818c427
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            # Keycloak: a API busca as chaves e chama o token endpoint pelo serviço do cluster;
            # o emissor aceito é o endereço público, o do login OIDC no navegador
            - name: Auth__Authority
              value: http://keycloak.default.svc.cluster.local:8080/keycloak/realms/SISTEMA_GEDE
            - name: Auth__Issuer
              value: https://subgd-api.df.gov.br/keycloak/realms/SISTEMA_GEDE
            - name: Auth__Key
              valueFrom:
                secretKeyRef:
                  name: jwt-secrets
                  key: SigningKeyProd
            - name: ConnectionStrings__PostgreSql
              valueFrom:
                secretKeyRef:
                  name: jwt-secrets
                  key: PostgreSqlProdConn
