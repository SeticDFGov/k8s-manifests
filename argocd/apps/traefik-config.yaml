# Configuração do Traefik do k3s (HelmChartConfig em kube-system). Ver k3s-traefik/README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SeticDFGov/k8s-manifests.git
    targetRevision: main
    path: k3s-traefik
    directory:
      include: '*.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
