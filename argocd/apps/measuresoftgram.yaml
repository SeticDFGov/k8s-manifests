apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: measuresoftgram
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SeticDFGov/k8s-manifests.git
    targetRevision: main
    path: measuresoftgram
  destination:
    server: https://kubernetes.default.svc
    namespace: measuresoftgram
  # As réplicas do front e do service são do Sablier (0 parado, 1 em uso); sem isto o
  # selfHeal religaria o MSG a cada desligamento
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
