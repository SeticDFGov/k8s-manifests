apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: adote-uma-praca-hml
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SeticDFGov/k8s-manifests.git
    targetRevision: main
    path: adote-uma-praca/overlays/homologacao
  destination:
    server: https://kubernetes.default.svc
    namespace: adote-hml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
