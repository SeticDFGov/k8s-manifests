apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sablier
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SeticDFGov/k8s-manifests.git
    targetRevision: main
    # Só os arquivos da raiz de sablier/; k3s-traefik/ é aplicado à mão (ver o README de lá)
    path: sablier
  destination:
    server: https://kubernetes.default.svc
    namespace: sablier
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
