apiVersion: apps/v1
kind: Deployment
metadata:
  name: meu-front-deployment
  labels:
    app: meu-front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meu-front
  template:
    metadata:
      labels:
        app: meu-front
    spec:
      # Imagens privadas no GHCR (ghcr.io/seticdfgov/*). O Secret é criado à mão no
      # namespace, fora do Git (ver docs/ghcr.md).
      imagePullSecrets:
        - name: ghcr-seticdfgov
      containers:
        - name: meu-front-container
          image: ghcr.io/seticdfgov/gede-front:11473d7
          imagePullPolicy: Always
          ports:
            - containerPort: 4200
